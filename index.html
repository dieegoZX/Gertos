<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analytics Pro - Análise Avançada de Dados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #3b82f6;
            --dark: #1e293b;
            --light: #f8fafc;
        }

    [data-theme="dark"] {
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --text-primary: #f1f5f9;
        --text-secondary: #cbd5e1;
        --border: #475569;
    }

    [data-theme="light"] {
        --bg-primary: #ffffff;
        --bg-secondary: #f8fafc;
        --bg-tertiary: #e2e8f0;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --border: #e2e8f0;
    }

    * {
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-secondary);
        color: var(--text-primary);
    }

    .glass-effect {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .gradient-bg {
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    }

    .gradient-text {
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .card-hover {
        transition: all 0.3s ease;
    }

    .card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }

    .animate-fade-in {
        animation: fadeIn 0.6s ease-out forwards;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .animate-slide-up {
        animation: slideUp 0.5s ease-out forwards;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .loader {
        border: 4px solid rgba(99, 102, 241, 0.1);
        border-top: 4px solid var(--primary);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .tab-active {
        border-bottom-color: var(--primary);
        color: var(--primary);
    }

    .custom-scrollbar::-webkit-scrollbar {
        width: 8px;
        height: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
        background: var(--bg-tertiary);
        border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 10px;
    }

    .pulse-animation {
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); }
        70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); }
        100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); }
    }

    .tooltip {
        position: relative;
    }

    .tooltip-text {
        visibility: hidden;
        background-color: var(--dark);
        color: white;
        text-align: center;
        border-radius: 6px;
        padding: 5px 10px;
        position: absolute;
        z-index: 1000;
        bottom: 125%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.3s;
        white-space: nowrap;
        font-size: 12px;
    }

    .tooltip:hover .tooltip-text {
        visibility: visible;
        opacity: 1;
    }

    .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 9999;
        animation: slideInRight 0.3s ease-out;
    }

    @keyframes slideInRight {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }

    .stat-card {
        background: var(--bg-primary);
        border: 1px solid var(--border);
        position: relative;
        overflow: hidden;
    }

    .stat-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
    }

    .filter-tag {
        display: inline-block;
        padding: 4px 12px;
        background: var(--primary);
        color: white;
        border-radius: 20px;
        font-size: 12px;
        margin: 2px;
        animation: fadeIn 0.3s ease-out;
    }

    .chart-container {
        position: relative;
        height: 400px;
        width: 100%;
    }

    @media (max-width: 768px) {
        .chart-container {
            height: 300px;
        }
    }
</style></head>
<body data-theme="light">
    <!-- Header -->
    <header class="gradient-bg text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <i class="fas fa-chart-line text-3xl"></i>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-bold">Dashboard Analytics Pro</h1>
                        <p class="text-sm opacity-90">Análise Avançada de Dados CSV</p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="themeToggle" class="p-2 rounded-lg hover:bg-white hover:bg-opacity-20 transition">
                        <i class="fas fa-moon text-xl"></i>
                    </button>
                    <button id="helpBtn" class="p-2 rounded-lg hover:bg-white hover:bg-opacity-20 transition">
                        <i class="fas fa-question-circle text-xl"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

<!-- Main Content -->
<main class="container mx-auto p-4 md:p-8">
    <!-- Upload Section -->
    <section id="uploadSection" class="mb-8 animate-fade-in">
        <div class="max-w-4xl mx-auto">
            <div class="stat-card rounded-2xl shadow-xl p-8 card-hover">
                <div class="text-center mb-6">
                    <i class="fas fa-cloud-upload-alt text-6xl text-indigo-500 mb-4"></i>
                    <h2 class="text-2xl font-bold mb-2">Carregar Dados</h2>
                    <p class="text-gray-500">Faça upload do seu arquivo CSV para começar a análise</p>
                </div>

                <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-indigo-500 transition-colors">
                    <input type="file" id="csvFile" accept=".csv" class="hidden">
                    <label for="csvFile" class="cursor-pointer">
                        <i class="fas fa-file-csv text-5xl text-gray-400 mb-4"></i>
                        <p class="text-lg font-medium mb-2">Arraste e solte ou clique para selecionar</p>
                        <p class="text-sm text-gray-500">Arquivos CSV suportados</p>
                        <button class="mt-4 px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">
                            <i class="fas fa-folder-open mr-2"></i>Selecionar Arquivo
                        </button>
                    </label>
                </div>

                <div id="loadingSpinner" class="hidden justify-center items-center mt-6">
                    <div class="loader"></div>
                </div>

                <div id="errorMessage" class="hidden mt-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                    <div class="flex items-center">
                        <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
                        <span id="errorText" class="text-red-700"></span>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Dashboard Section -->
    <section id="dashboardSection" class="hidden animate-fade-in">
        <!-- Stats Cards -->
        <div id="statsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8"></div>

        <!-- Controls Panel -->
        <div class="stat-card rounded-2xl shadow-xl p-6 mb-8">
            <h3 class="text-xl font-bold mb-6 flex items-center">
                <i class="fas fa-sliders-h mr-2 text-indigo-500"></i>
                Painel de Controle
            </h3>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Dimension Selection -->
                <div>
                    <label class="block text-sm font-medium mb-2">Dimensão (Eixo X)</label>
                    <select id="dimensionSelect" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <!-- Metrics Selection -->
                <div>
                    <label class="block text-sm font-medium mb-2">Métricas</label>
                    <div id="metricSelector" class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar"></div>
                </div>

                <!-- Chart Types -->
                <div>
                    <label class="block text-sm font-medium mb-2">Tipos de Gráfico</label>
                    <div id="chartTypeSelector" class="grid grid-cols-2 gap-2"></div>
                </div>
            </div>

            <!-- Advanced Controls -->
            <div class="mt-6 pt-6 border-t grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-2">Filtros Avançados</label>
                    <div class="flex space-x-2">
                        <input type="text" id="filterInput" placeholder="Filtrar dados..." class="flex-1 p-2 border rounded-lg">
                        <button id="applyFilter" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                            <i class="fas fa-filter"></i>
                        </button>
                    </div>
                    <div id="activeFilters" class="mt-2"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-2">Ações Rápidas</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="refreshData" class="px-3 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
                            <i class="fas fa-sync-alt mr-1"></i>Atualizar
                        </button>
                        <button id="clearFilters" class="px-3 py-2 bg-gray-100 rounded-lg hover:bg-gray-200 transition">
                            <i class="fas fa-times mr-1"></i>Limpar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Export Options -->
            <div class="mt-6 pt-6 border-t flex flex-wrap gap-3">
                <button id="shareDashboard" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                    <i class="fas fa-share-alt mr-2"></i>Compartilhar
                </button>
                <button id="exportPDF" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition">
                    <i class="fas fa-file-pdf mr-2"></i>Exportar PDF
                </button>
                <button id="exportExcel" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                    <i class="fas fa-file-excel mr-2"></i>Exportar Excel
                </button>
                <button id="exportJSON" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition">
                    <i class="fas fa-file-code mr-2"></i>Exportar JSON
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="border-b mb-6">
            <nav class="flex space-x-8">
                <button class="tab-btn py-3 px-1 border-b-2 font-medium tab-active" data-tab="overview">
                    <i class="fas fa-chart-pie mr-2"></i>Visão Geral
                </button>
                <button class="tab-btn py-3 px-1 border-b-2 font-medium text-gray-500" data-tab="charts">
                    <i class="fas fa-chart-bar mr-2"></i>Gráficos
                </button>
                <button class="tab-btn py-3 px-1 border-b-2 font-medium text-gray-500" data-tab="table">
                    <i class="fas fa-table mr-2"></i>Tabela de Dados
                </button>
                <button class="tab-btn py-3 px-1 border-b-2 font-medium text-gray-500" data-tab="statistics">
                    <i class="fas fa-calculator mr-2"></i>Estatísticas
                </button>
            </nav>
        </div>

        <!-- Tab Content -->
        <div id="tabContent">
            <!-- Overview Tab -->
            <div id="overviewTab" class="tab-content">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="stat-card rounded-xl p-6">
                        <h3 class="text-lg font-bold mb-4">Distribuição de Dados</h3>
                        <div class="chart-container">
                            <canvas id="overviewChart"></canvas>
                        </div>
                    </div>
                    <div class="stat-card rounded-xl p-6">
                        <h3 class="text-lg font-bold mb-4">Top Valores</h3>
                        <div id="topValues" class="space-y-3"></div>
                    </div>
                </div>
            </div>

            <!-- Charts Tab -->

        </div>
    </section>
</main>
</body>
</html>
