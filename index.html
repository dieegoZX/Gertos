<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analytics Pro - Análise Avançada de Dados</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-matrix@^1.1.1/dist/chartjs-chart-matrix.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.23/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; /* indigo-500 */
            --secondary: #8b5cf6; /* violet-500 */
            --dark: #1e293b; /* slate-800 */
        }
        [data-theme="dark"] {
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-tertiary: #334155;
            --text-primary: #f1f5f9; --text-secondary: #cbd5e1; --border: #475569;
        }
        [data-theme="light"] {
            --bg-primary: #ffffff; --bg-secondary: #f8fafc; --bg-tertiary: #e2e8f0;
            --text-primary: #1e293b; --text-secondary: #64748b; --border: #e2e8f0;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-secondary); color: var(--text-primary); transition: background-color 0.3s, color 0.3s; }
        .gradient-bg { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); }
        .stat-card { background: var(--bg-primary); border: 1px solid var(--border); position: relative; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
        .tab-btn { transition: color 0.3s, border-color 0.3s; }
        .tab-active { border-bottom-color: var(--primary); color: var(--primary); }
        .loader { border: 4px solid rgba(99, 102, 241, 0.1); border-top: 4px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .chart-container { position: relative; height: 400px; width: 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: var(--bg-tertiary); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body data-theme="light">
    <header class="gradient-bg text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fas fa-chart-pie text-2xl"></i>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold">Analytics Pro</h1>
                </div>
            </div>
            <button id="themeToggle" class="p-2 rounded-full hover:bg-white hover:bg-opacity-10 transition-colors"><i class="fas fa-moon text-lg"></i></button>
        </div>
    </header>

    <main class="container mx-auto p-4 sm:p-6 lg:p-8">
        <section id="uploadSection" class="mb-8 animate-fade-in max-w-3xl mx-auto">
            <div class="stat-card rounded-xl shadow-lg p-6 sm:p-8">
                <div class="text-center mb-6">
                    <i class="fas fa-cloud-upload-alt text-5xl text-indigo-500 mb-3"></i>
                    <h2 class="text-xl sm:text-2xl font-bold">Carregar Planilha</h2>
                    <p class="text-sm text-text-secondary mt-1">Arraste, solte ou selecione seu arquivo CSV para iniciar a análise.</p>
                </div>
                <div id="dropZone" class="border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-6 text-center hover:border-indigo-500 transition-colors cursor-pointer">
                    <input type="file" id="csvFile" accept=".csv" class="hidden">
                    <label for="csvFile" class="cursor-pointer flex flex-col items-center justify-center">
                        <i class="fas fa-file-csv text-4xl text-gray-400 mb-3"></i>
                        <p class="text-md font-medium">Arraste e solte ou clique para selecionar</p>
                        <p class="text-xs text-text-secondary mt-1">Apenas arquivos .csv</p>
                    </label>
                </div>
                <div id="loadingSpinner" class="hidden justify-center items-center mt-6"><div class="loader"></div></div>
                <div id="errorMessage" class="hidden mt-4 p-3 bg-red-100 border border-red-200 rounded-md text-sm text-red-700"></div>
            </div>
        </section>

        <section id="dashboardSection" class="hidden animate-fade-in">
            <div id="statsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"></div>
            <div class="stat-card rounded-xl shadow-lg p-4 sm:p-6 mb-6">
                <h3 class="text-lg font-bold mb-4 flex items-center"><i class="fas fa-sliders-h mr-2 text-indigo-500"></i>Painel de Controle</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label for="dimensionSelect" class="block text-xs font-medium text-text-secondary mb-1">Dimensão (Eixo X)</label>
                        <select id="dimensionSelect" class="w-full p-2 border border-gray-300 rounded-md bg-gray-50 text-sm focus:ring-2 focus:ring-indigo-500"></select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Métricas</label>
                        <div id="metricSelector" class="space-y-2 max-h-40 overflow-y-auto custom-scrollbar p-2 border rounded-lg bg-gray-50"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-2">Tipos de Gráfico</label>
                        <div id="chartTypeSelector" class="grid grid-cols-2 gap-2 p-2 border rounded-lg bg-gray-50"></div>
                    </div>
                </div>
                <div class="mt-6 pt-6 border-t flex flex-wrap gap-3">
                    <button id="exportPDF" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition"><i class="fas fa-file-pdf mr-2"></i>Exportar PDF</button>
                    <button id="exportExcel" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition"><i class="fas fa-file-excel mr-2"></i>Exportar Excel</button>
                </div>
            </div>
            <div class="border-b mb-6">
                <nav id="tabs" class="flex space-x-8"></nav>
            </div>
            <div id="tabContent"></div>
        </section>
    </main>

<script>
    // Register Chart.js plugins
    Chart.register(ChartDataLabels, ChartMatrix.MatrixController, ChartMatrix.MatrixElement);

    // --- State Management ---
    let fullData = [], filteredData = [], headers = [], numericHeaders = [], charts = {};
    const TABS = [
        { id: 'overview', label: 'Visão Geral', icon: 'fa-chart-pie' },
        { id: 'charts', label: 'Gráficos', icon: 'fa-chart-bar' },
        { id: 'table', label: 'Tabela de Dados', icon: 'fa-table' },
        { id: 'statistics', label: 'Estatísticas', icon: 'fa-calculator' },
    ];

    // --- DOM Elements ---
    const themeToggle = document.getElementById('themeToggle');
    const csvFileInput = document.getElementById('csvFile');
    const dropZone = document.getElementById('dropZone');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const errorMessage = document.getElementById('errorMessage');
    const uploadSection = document.getElementById('uploadSection');
    const dashboardSection = document.getElementById('dashboardSection');

    // --- Event Listeners ---
    themeToggle.addEventListener('click', toggleTheme);
    csvFileInput.addEventListener('change', (e) => handleFileUpload(e.target.files[0]));
    dropZone.addEventListener('click', () => csvFileInput.click()); // Make the entire zone clickable
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-indigo-500'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('border-indigo-500');
        handleFileUpload(e.dataTransfer.files[0]);
    });

    // --- Initialization ---
    function init() {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        themeToggle.innerHTML = savedTheme === 'light' ? '<i class="fas fa-moon text-xl"></i>' : '<i class="fas fa-sun text-xl"></i>';
    }

    // --- Core Functions ---
    function handleFileUpload(file) {
        if (!file || !file.name.toLowerCase().endsWith('.csv')) {
            showError('Por favor, selecione um arquivo CSV válido.');
            return;
        }
        loadingSpinner.style.display = 'flex';
        errorMessage.style.display = 'none';

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            dynamicTyping: true,
            complete: (results) => {
                loadingSpinner.style.display = 'none';
                if (results.errors.length) {
                    showError('Erro ao processar o arquivo CSV.');
                    return;
                }
                fullData = results.data;
                filteredData = [...fullData];
                headers = results.meta.fields;
                numericHeaders = headers.filter(h => fullData.some(row => typeof row[h] === 'number'));
                initializeDashboard();
            },
            error: () => showError('Não foi possível ler o arquivo.')
        });
    }

    function initializeDashboard() {
        uploadSection.style.display = 'none';
        dashboardSection.classList.remove('hidden');
        populateSelectors();
        renderTabs();
        switchTab(TABS[0].id);
    }

    function populateSelectors() {
        const dimensionSelect = document.getElementById('dimensionSelect');
        dimensionSelect.innerHTML = headers.map(h => `<option value="${h}">${h}</option>`).join('');
        dimensionSelect.addEventListener('change', updateAllViews);

        const metricSelector = document.getElementById('metricSelector');
        metricSelector.innerHTML = numericHeaders.map(h => `<label class="flex items-center"><input type="checkbox" value="${h}" class="metric-checkbox rounded text-indigo-600 mr-2"><span>${h}</span></label>`).join('');
        metricSelector.addEventListener('change', updateAllViews);

        const chartTypeSelector = document.getElementById('chartTypeSelector');
        const chartTypes = [{ id: 'bar', name: 'Barras' }, { id: 'line', name: 'Linha' }, { id: 'pie', name: 'Pizza' }, { id: 'doughnut', name: 'Rosca' }];
        chartTypeSelector.innerHTML = chartTypes.map(t => `<label class="flex items-center"><input type="checkbox" value="${t.id}" class="chart-type-checkbox rounded text-indigo-600 mr-2" checked><span>${t.name}</span></label>`).join('');
        chartTypeSelector.addEventListener('change', updateAllViews);
    }

    function renderTabs() {
        const tabsContainer = document.getElementById('tabs');
        tabsContainer.innerHTML = TABS.map(tab => `
            <button class="tab-btn py-3 px-1 border-b-2 font-medium" data-tab="${tab.id}">
                <i class="${tab.icon} mr-2"></i>${tab.label}
            </button>
        `).join('');
        tabsContainer.querySelectorAll('.tab-btn').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.tab)));
    }

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('tab-active', btn.dataset.tab === tabId));
        const tabContent = document.getElementById('tabContent');
        tabContent.innerHTML = `<div id="${tabId}Tab"></div>`; // Clear and set up tab
        updateAllViews();
    }

    function updateAllViews() {
        renderStatsCards();
        const activeTab = document.querySelector('.tab-btn.tab-active').dataset.tab;
        const dimension = document.getElementById('dimensionSelect').value;
        const metrics = Array.from(document.querySelectorAll('.metric-checkbox:checked')).map(cb => cb.value);
        const chartTypes = Array.from(document.querySelectorAll('.chart-type-checkbox:checked')).map(cb => cb.value);

        if (activeTab === 'overview') renderOverview(dimension);
        if (activeTab === 'charts') renderCharts(dimension, metrics, chartTypes);
        if (activeTab === 'table') renderTable();
        if (activeTab === 'statistics') renderStatistics();
    }

    function renderStatsCards() {
        const container = document.getElementById('statsContainer');
        const stats = [
            { title: 'Total de Registros', value: filteredData.length, icon: 'fa-database' },
            { title: 'Colunas', value: headers.length, icon: 'fa-columns' },
            { title: 'Colunas Numéricas', value: numericHeaders.length, icon: 'fa-chart-line' },
        ];
        container.innerHTML = stats.map(s => `<div class="stat-card rounded-xl p-6"><p class="text-sm text-gray-500">${s.title}</p><p class="text-3xl font-bold mt-2">${s.value}</p></div>`).join('');
    }

    function renderOverview(dimension) {
        const container = document.getElementById('overviewTab');
        if (!dimension) { container.innerHTML = "Selecione uma dimensão."; return; }
        // Simplified content for brevity
        container.innerHTML = `<div class="chart-container"><canvas id="overviewChart"></canvas></div>`;
        const counts = filteredData.reduce((acc, row) => { acc[row[dimension]] = (acc[row[dimension]] || 0) + 1; return acc; }, {});
        createChart('overviewChart', 'pie', Object.keys(counts), [{ data: Object.values(counts) }]);
    }

    function renderCharts(dimension, metrics, chartTypes) {
        const container = document.getElementById('chartsTab');
        if (!dimension || metrics.length === 0) { container.innerHTML = "Selecione dimensão e métricas."; return; }
        container.innerHTML = chartTypes.map(type => `<div class="stat-card rounded-xl p-6"><h3 class="font-bold capitalize">${type} Chart</h3><div class="chart-container"><canvas id="chart-${type}"></canvas></div></div>`).join('');
        const labels = [...new Set(filteredData.map(row => row[dimension]))];
        const datasets = metrics.map(metric => ({
            label: metric,
            data: labels.map(label => filteredData.filter(row => row[dimension] === label).reduce((sum, row) => sum + (Number(row[metric]) || 0), 0))
        }));
        chartTypes.forEach(type => createChart(`chart-${type}`, type, labels, datasets));
    }

    let sortConfig = { key: null, direction: 'ascending' };
    let currentPage = 1;
    let rowsPerPage = 10;

    function renderTable() {
        const container = document.getElementById('tableTab');

        // Sorting logic
        if (sortConfig.key) {
            filteredData.sort((a, b) => {
                if (a[sortConfig.key] < b[sortConfig.key]) return sortConfig.direction === 'ascending' ? -1 : 1;
                if (a[sortConfig.key] > b[sortConfig.key]) return sortConfig.direction === 'ascending' ? 1 : -1;
                return 0;
            });
        }

        // Pagination logic
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const paginatedData = filteredData.slice(start, end);

        const tableHTML = `
            <div class="overflow-x-auto custom-scrollbar stat-card rounded-xl p-4">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr>
                            ${headers.map(h => `<th class="p-2 cursor-pointer" onclick="sortTable('${h}')">${h} ${sortConfig.key === h ? (sortConfig.direction === 'ascending' ? '▲' : '▼') : ''}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${paginatedData.map(row => `<tr>${headers.map(h => `<td class="p-2 border-t border-border">${row[h]}</td>`).join('')}</tr>`).join('')}
                    </tbody>
                </table>
            </div>
            <div class="flex justify-between items-center mt-4 text-sm">
                <span>Página ${currentPage} de ${Math.ceil(filteredData.length / rowsPerPage)}</span>
                <div>
                    <button onclick="changePage(currentPage - 1)" class="px-3 py-1 border rounded-md mr-2 disabled:opacity-50" ${currentPage === 1 ? 'disabled' : ''}>Anterior</button>
                    <button onclick="changePage(currentPage + 1)" class="px-3 py-1 border rounded-md disabled:opacity-50" ${currentPage === Math.ceil(filteredData.length / rowsPerPage) ? 'disabled' : ''}>Próximo</button>
                </div>
            </div>
        `;
        container.innerHTML = tableHTML;
    }

    function sortTable(key) {
        if (sortConfig.key === key && sortConfig.direction === 'ascending') {
            sortConfig.direction = 'descending';
        } else {
            sortConfig.key = key;
            sortConfig.direction = 'ascending';
        }
        currentPage = 1;
        renderTable();
    }

    function changePage(page) {
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderTable();
    }

    function renderStatistics() {
        const container = document.getElementById('statisticsTab');
        container.innerHTML = `<div class="stat-card rounded-xl p-6"><h3 class="font-bold">Estatísticas Descritivas</h3>...</div><div class="stat-card rounded-xl p-6"><h3 class="font-bold">Matriz de Correlação</h3><div class="chart-container"><canvas id="correlationChart"></canvas></div></div>`;
        const matrixData = numericHeaders.map(h1 => numericHeaders.map(h2 => ({ x: h1, y: h2, v: calculateCorrelation(h1, h2) }))).flat();
        createChart('correlationChart', 'matrix', [], [{ data: matrixData, width: ({chart}) => (chart.chartArea.width / numericHeaders.length), height: ({chart}) => (chart.chartArea.height / numericHeaders.length) }]);
    }

    function createChart(canvasId, type, labels, datasets) {
        if (charts[canvasId]) charts[canvasId].destroy();
        const ctx = document.getElementById(canvasId);
        if (!ctx) return;

        // Add a loading spinner feel
        const container = ctx.parentElement;
        container.style.opacity = 0.5;

        setTimeout(() => {
            charts[canvasId] = new Chart(ctx, {
                type,
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.7)',
                            titleFont: { size: 14 },
                            bodyFont: { size: 12 },
                            padding: 10,
                            cornerRadius: 4,
                            callbacks: {
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) {
                                        label += ': ';
                                    }
                                    if (context.parsed.y !== null) {
                                        label += new Intl.NumberFormat('pt-BR', { style: 'decimal' }).format(context.parsed.y);
                                    }
                                    return label;
                                }
                            }
                        }
                    },
                    animation: {
                        duration: 500,
                        easing: 'easeInOutQuart'
                    }
                }
            });
            container.style.opacity = 1;
        }, 300); // Small delay to simulate loading and allow rendering
    }

    function calculateCorrelation(col1, col2) {
        const values1 = filteredData.map(row => Number(row[col1])).filter(v => !isNaN(v));
        const values2 = filteredData.map(row => Number(row[col2])).filter(v => !isNaN(v));
        const n = Math.min(values1.length, values2.length);
        if (n === 0) return 0;
        const mean1 = values1.reduce((a, b) => a + b) / n;
        const mean2 = values2.reduce((a, b) => a + b) / n;
        let cov = 0, std1 = 0, std2 = 0;
        for (let i = 0; i < n; i++) {
            const d1 = values1[i] - mean1, d2 = values2[i] - mean2;
            cov += d1 * d2;
            std1 += d1 * d1;
            std2 += d2 * d2;
        }
        return cov / (Math.sqrt(std1 * std2));
    }

    // --- Utility Functions ---
    function toggleTheme() {
        const current = document.body.getAttribute('data-theme');
        const next = current === 'light' ? 'dark' : 'light';
        document.body.setAttribute('data-theme', next);
        themeToggle.innerHTML = next === 'light' ? '<i class="fas fa-moon text-xl"></i>' : '<i class="fas fa-sun text-xl"></i>';
        localStorage.setItem('theme', next);
    }
    function showError(msg) { errorMessage.textContent = msg; errorMessage.style.display = 'block'; }
    document.getElementById('exportPDF').addEventListener('click', () => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Relatório de Dados", 14, 16);
        doc.autoTable({ head: [headers], body: filteredData.map(row => headers.map(h => row[h])) });
        doc.save('dados.pdf');
    });
    document.getElementById('exportExcel').addEventListener('click', () => {
        const ws = XLSX.utils.json_to_sheet(filteredData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Dados");
        XLSX.writeFile(wb, "dados.xlsx");
    });

    init();
</script>
</body>
</html>
